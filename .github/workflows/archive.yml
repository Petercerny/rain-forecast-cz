name: Archive to R2

# Every night: copy each finished day of forecasts and observations to Cloudflare R2 (Parquet),
# check the copy against Postgres, then delete rows older than 15 days from Postgres.
# Setup: README, "Long-term archive (Cloudflare R2)".

on:
  schedule:
    - cron: "30 2 * * *"   # daily, 02:30 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: read Postgres and report, but upload and delete nothing"
        type: boolean
        default: false

# Never run two archives at once.
concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The `archiver` role (python -m src.db_migrate --create-archiver-role). It can read and DELETE.
      ARCHIVE_DATABASE_URL: ${{ secrets.ARCHIVE_DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-archive.txt

      - name: Check configuration
        run: |
          for name in ARCHIVE_DATABASE_URL R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (see README, 'Long-term archive')."
              exit 1
            fi
          done

      - name: Archive and prune
        run: python -m src.archive ${{ inputs.dry_run && '--dry-run' || '' }}
