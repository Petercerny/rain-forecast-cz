# Non-secret pipeline settings. Secrets and per-deployment values (User-Agent, repo URL)
# come from environment variables / GitHub repository variables, see .env.example.

# "template" (default, deterministic, used in CI) or "ollama" (local model).
# Can be overridden with the SUMMARIZER environment variable.
summarizer: template

ollama:
  url: http://localhost:11434
  model: llama3.2:3b
  timeout_seconds: 120

# Forecast window shown on the site and used for the summaries.
window_hours: 48

# A source whose newest fetch is older than this is treated as missing
# (so a broken API does not silently show old numbers as if they were fresh).
stale_after_hours: 6

# The site shows an "outdated" banner when its data is older than this (checked in the visitor's browser,
# so it still works if the hourly job stops completely).
stale_banner_after_hours: 6

# A weather-station reading older than this is not shown as "now" (the site falls back to the forecast hour).
# ČHMÚ rewrites its 10-minute files once an hour, so the newest reading is normally 10 to 70 minutes old.
observation_stale_minutes: 120

# The ingest job runs every ~10 minutes but asks Open-Meteo for a place at most this often
# (its models update about hourly). MET Norway is polled by its own `Expires` header instead.
open_meteo_min_interval_minutes: 55

monitor:
  # /api/health answers 503 (and the uptime monitor e-mails you) when a source has no new data for this long.
  # Both sources normally deliver about hourly.
  alert_after_hours: 3
