# Locations to forecast. Edit freely: add or remove entries, the pipeline picks them up.
# The 13 regional capitals of Czechia (Praha is the capital of two regions).
# Coordinates are city centres (GeoNames-based, cross-checked with the Open-Meteo
# geocoding API), kept to 4 decimals because MET Norway requires <= 4 decimals.
# `station` is the nearest ČHMÚ automatic station with temperature and wind (see `python -m src.stations --suggest`);
# its 10-minute readings drive the "Now" view. Add `rain_station:` only if that station has no rain gauge.
# Each name also becomes the page address, e.g. "České Budějovice" -> /ceske-budejovice/
locations:
