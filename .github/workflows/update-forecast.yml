name: Update forecast

on:
  schedule:
    - cron: "23 * * * *"   # hourly, at minute 23 (an "odd" minute spreads load on the free APIs)
  workflow_dispatch:        # manual "Run workflow" button

# Never run two updates at once: they would both push to the data branch.
concurrency:
  group: update-forecast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # to push snapshots to the `data` branch
    env:
      # Repository variables (Settings -> Secrets and variables -> Actions -> Variables).
      # USER_AGENT must look like: rain-forecast-cz/0.1 https://github.com/<you>/<repo>
      USER_AGENT: ${{ vars.USER_AGENT }}
      REPO_URL: ${{ vars.REPO_URL || format('{0}/{1}', github.server_url, github.repository) }}
      SUMMARIZER: template  # CI never uses the local LLM
      # The Postgres database (Supabase session-pooler URL for the `pipeline` role), a repository SECRET.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Free CARTO basemap key for the map tiles (optional: without it the map uses OpenStreetMap tiles).
      CARTO_KEY: ${{ vars.CARTO_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check configuration
        run: |
          if [ -z "$USER_AGENT" ]; then
            echo "::warning::Repository variable USER_AGENT is not set, so MET Norway will be skipped."
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is not set (see README, 'Set up the database')."
            exit 1
          fi

      - name: Random delay (be gentle with the APIs)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 120))

      # The snapshot history lives on its own branch, checked out into ./data.
      # First run: the branch does not exist yet, so create an empty (orphan) one.
      - name: Check out data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch origin data:refs/remotes/origin/data
            git worktree add -B data data origin/data
          else
            git worktree add --orphan -b data data
          fi

      - name: Ingest (fetch both APIs, append Parquet snapshots)
        run: python -m src.ingest

      # The Parquet files are the raw log and the backup: commit them right away, before anything
      # that talks to the database, so a database outage can never lose data.
      - name: Commit snapshots to the data branch
        run: |
          cp DATA_LICENSES.md data/DATA_LICENSES.md          # attribution travels with the data
          cp .github/data-branch-README.md data/README.md
          cd data
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Snapshots $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:refs/heads/data
          fi

      - name: Load snapshots into the database (catches up on anything missed)
        run: python -m src.load_db

      - name: Transform (SQL in Postgres)
        run: python -m src.transform

      - name: Summarize
        run: python -m src.summarize

      - name: Build site
        run: python -m src.build_site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Runs even when the build failed. Fails (and opens a GitHub issue) if a source has had no new
  # data for too long. If the build keeps failing, the data goes stale and this triggers.
  monitor:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check data freshness
        id: check
        continue-on-error: true
        run: python -m src.monitor

      - name: Open an alert issue (once, while the problem lasts)
        if: steps.check.outcome == 'failure'
        run: |
          gh label create data-stale --color B60205 --description "Forecast data stopped arriving" 2>/dev/null || true
          if [ -z "$(gh issue list --label data-stale --state open --json number --jq '.[0].number')" ]; then
            gh issue create --label data-stale               --title "Forecast data is stale or the database is unreachable"               --body "The freshness check failed in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. See the log of the 'Check data freshness' step. This issue closes itself when data is flowing again."
          fi

      - name: Close the alert issue after recovery
        if: steps.check.outcome == 'success'
        run: |
          for n in $(gh issue list --label data-stale --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Data is fresh again (run ${{ github.run_id }})."
          done

      - name: Fail this job if the data is stale
        if: steps.check.outcome == 'failure'
        run: exit 1
